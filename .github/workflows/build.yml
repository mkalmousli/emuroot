name: Build

# Auto-build on every push/PR: a fast sanity build for the runner's own
# architecture, plus a full cross-architecture build (the same
# `--docker` path the release workflow uses, which also auto-builds the
# Android NDK targets - build.py finds or downloads the NDK itself, see
# tools/toolchains.py; --no-ndk skips those) so a broken architecture is
# caught here, not only when someone runs a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quick-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run the test suite
        run: make && ./test.py --binary build/native/bin/emuroot

  all-architectures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-build every glibc architecture (via Docker) and the Android NDK targets
        run: ./build.py --docker
      - name: List what got built
        run: find build -maxdepth 3 -name emuroot -exec file {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: emuroot-all-architectures
          path: |
            build/*/bin/
            build/*/lib/
          retention-days: 14
