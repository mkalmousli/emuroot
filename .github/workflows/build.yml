name: Test

# Everything runs in Docker (see test.py): the unit-style cases, the env-only
# fallback, and real Ubuntu / Debian / Alpine / Fedora / BusyBox / 32-bit root
# filesystems, as an unprivileged user and as root. A second job builds every
# architecture.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test.py --net

  all-architectures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-build every glibc architecture (via Docker), plus the NDK and musl targets
        run: ./build.py --docker
      - run: find build -maxdepth 3 -name emuroot -exec file {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: emuroot-all-architectures
          path: |
            build/*/bin/
            build/*/lib/
          retention-days: 14
