name: Android

# Two ways of testing on Android versions:
#  - userland: each version's real userland (bionic, toybox, mksh), unpacked from
#    Google's system images and run on the runner's Linux kernel in Docker
#  - emulator: a real Android kernel, in an emulator (needs KVM)
# To cover another Android version, add its API level to a matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  userland:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 26, 28, 29, 30, 31, 33, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./test.py --android ${{ matrix.api-level }}

  build-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./build.py --ndk "$ANDROID_NDK_LATEST_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/android-*/bin/emuroot

  emulator:
    needs: build-ndk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 28, 30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          script: python3 test.py --adb
