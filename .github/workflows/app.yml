name: Android library

# The Android library (an AAR with JNI, android/): built like a Google Play app, checked
# for Play's native-library rules, and exercised inside a real app on emulators from
# Android 5 to 16 - including an Android 15 image with 16 KB memory pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709" "cmake;3.22.1" >/dev/null
      - name: Build the AAR, the sample app, and the test APK
        working-directory: android
        run: ./gradlew :emuroot:assembleRelease :sample:assembleRelease :emuroot:assembleDebugAndroidTest --stacktrace
      - name: Google Play rules - 16 KB aligned 64-bit libraries, 64-bit ABIs present
        run: python3 tools/check_elf_alignment.py android/emuroot/build/outputs/aar/emuroot-release.aar android/sample/build/outputs/apk/release/sample-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emuroot-aar
          path: |
            android/emuroot/build/outputs/aar/emuroot-release.aar
            android/sample/build/outputs/apk/release/sample-release-unsigned.apk

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api-level: 21, target: default }
          - { api-level: 24, target: default }
          - { api-level: 26, target: default }
          - { api-level: 28, target: default }
          - { api-level: 29, target: default }
          - { api-level: 30, target: default }
          - { api-level: 31, target: default }
          - { api-level: 33, target: default }
          - { api-level: 34, target: default }
          - { api-level: 35, target: default }
          - { api-level: 36, target: default }
          # Android 15 with 16 KB pages: what new Google Play requirements are about
          - { api-level: 35, target: google_apis_ps16k, experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709" "cmake;3.22.1" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          script: |
            cd android && ./gradlew :emuroot:connectedDebugAndroidTest --stacktrace || { adb logcat -d | grep -iE "SIGSYS|seccomp|emuroot|Fatal signal|syscall" | tail -60; exit 1; }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.api-level }}-${{ matrix.target }}
          path: android/emuroot/build/reports/androidTests
